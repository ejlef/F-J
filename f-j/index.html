<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F-J Logo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .logo-container {
      width: 90vmin;
      max-width: 500px;
      aspect-ratio: 1 / 1;
      background-color: #ffffff;
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      padding: 20px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <!-- Embedded Intertwined F/J Design Monogram Visual Layout -->
    <svg xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
      <defs>
        <linearGradient id="fjGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00d2ff" />
          <stop offset="100%" stop-color="#0066ff" />
        </linearGradient>
      </defs>
      <g transform="translate(150, 100)">
        <path d="M 50,40 
                 C 50,0 110,0 110,40 
                 L 110,60 
                 C 110,60 70,60 70,60 
                 L 70,100 
                 L 110,100 
                 L 110,130 
                 L 70,130 
                 L 70,220 
                 C 70,260 110,260 110,220 
                 L 110,90 
                 L 150,90 
                 L 150,220 
                 C 150,300 30,300 30,220 
                 L 30,130 
                 L 0,130 
                 L 0,100 
                 L 30,100 
                 L 30,40 
                 C 30,-20 150,-20 150,40 
                 Z" 
              fill="url(#fjGradient)" />
      </g>
    </svg>
  </div>

</body>
</html>
